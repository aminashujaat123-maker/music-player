<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveform — Music Player</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-mark">W</div>
          <span>Waveform</span>
        </div>

        <nav class="nav-group">
          <a href="#" class="nav-link active" data-view="home">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2 2 10.5h3V21h5v-6h4v6h5V10.5h3z" />
            </svg>
            <span>Home</span>
          </a>
          <a href="#" class="nav-link" data-view="search">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"
              />
            </svg>
            <span>Search</span>
          </a>
          <a href="#" class="nav-link" data-view="library">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3 3h2v18H3zm4 4h2v14H7zm4-8h2v22h-2zm4 6h2v16h-2zm4-3h2v19h-2z"
              />
            </svg>
            <span>Your Library</span>
          </a>
        </nav>

        <button
          class="nav-link"
          id="addSongBtn"
          style="justify-content: flex-start; background: transparent"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
          </svg>
          <span>Add Song</span>
        </button>

        <div class="sidebar-divider"></div>

        <div class="section-heading" style="margin: 0">
          <h2 style="font-size: 14px">Recently Played</h2>
        </div>
        <div class="recent-list" id="sidebarRecent"></div>
      </aside>

      <!-- ============ MAIN ============ -->
      <main class="main">
        <div class="topbar">
          <div class="topbar-nav-arrows">
            <button onclick="history.back()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M15 4l-8 8 8 8V4z" />
              </svg>
            </button>
            <button onclick="history.forward()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M9 4l8 8-8 8V4z" />
              </svg>
            </button>
          </div>

          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"
              />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search for songs, artists, or albums"
            />
          </div>

          <div class="topbar-right" id="topbarRight"></div>
        </div>

        <div class="content" id="content">
          <!-- populated by app.js -->
        </div>
      </main>

      <!-- ============ PLAYER BAR ============ -->
      <div class="player-bar">
        <div class="player-now-playing" id="nowPlaying">
          <div class="np-cover-wrap">
            <img id="npCover" src="" alt="" style="display: none" />
            <div class="np-equalizer" id="npEqualizer">
              <div class="equalizer">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="info">
            <div class="title" id="npTitle">No song playing</div>
            <div class="artist" id="npArtist"></div>
          </div>
        </div>

        <div class="player-center">
          <div class="player-controls">
            <button id="prevBtn" title="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 5h2v14H6zm3.5 7L18 5v14z" />
              </svg>
            </button>
            <button id="playPauseBtn" class="play-pause-btn" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg
                id="pauseIcon"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="display: none"
              >
                <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
              </svg>
            </button>
            <button id="nextBtn" title="Next">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 5h2v14h-2zm-8 0L16 12 8 19z" />
              </svg>
            </button>
          </div>
          <div class="seek-row">
            <span id="currentTime">0:00</span>
            <input
              type="range"
              id="seekBar"
              class="seek-bar"
              min="0"
              max="100"
              value="0"
            />
            <span id="totalTime">0:00</span>
          </div>
        </div>

        <div class="player-extra">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="currentColor"
            style="color: var(--text-secondary)"
          >
            <path
              d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"
            />
          </svg>
          <input
            type="range"
            id="volumeBar"
            class="volume-bar"
            min="0"
            max="100"
            value="80"
          />
        </div>
      </div>
    </div>

    <!-- ============ ADD SONG MODAL ============ -->
    <div class="modal-overlay hidden" id="addSongModal">
      <div class="modal">
        <h2>Add a song</h2>
        <div class="error-msg" id="addSongError"></div>
        <form id="addSongForm">
          <div class="form-group">
            <label for="songTitle">Title</label>
            <input type="text" id="songTitle" required />
          </div>
          <div class="form-group">
            <label for="songArtist">Artist</label>
            <input type="text" id="songArtist" required />
          </div>
          <div class="form-group">
            <label for="songAlbum">Album (optional)</label>
            <input type="text" id="songAlbum" />
          </div>
          <div class="form-group">
            <label for="songFile">Audio file (mp3, wav)</label>
            <input type="file" id="songFile" accept="audio/*" required />
          </div>
          <div class="form-group">
            <label for="coverFile">Cover image (optional)</label>
            <input type="file" id="coverFile" accept="image/*" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="cancelAddSong">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Add Song</button>
          </div>
        </form>
      </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
